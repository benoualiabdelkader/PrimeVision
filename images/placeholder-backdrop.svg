<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">PrimeVision backdrop placeholder</title>
  <desc id="desc">Neutral placeholder for unavailable backdrop artwork.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset=".55" stop-color="#4c0519"/>
      <stop offset="1" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1180" cy="300" r="220" fill="#d4af37" opacity=".12"/>
  <circle cx="1370" cy="650" r="320" fill="#f8fafc" opacity=".05"/>
  <text x="120" y="760" fill="#d4af37" font-family="Arial, sans-serif" font-size="64" letter-spacing="12">PRIMEVISION</text>
</svg>
